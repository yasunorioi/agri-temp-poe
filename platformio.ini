; agri-temp-poe — M5Stack AtomS3 Lite + Atom PoE Base (W5500)
;                 DS18B20 × N multi-point 1-Wire temperature node
;
; PoE derivative of agri-temp-wifi. That node was WiFi because the ATOM U has no
; PoE base; the AtomS3 Lite sits on the Atom PoE base, so this one joins the
; wired -poe family and is built on agri-node-poe-core, like agri-env-poe.
;
; Hardware
;   - M5Stack AtomS3 Lite (ESP32-S3) + M5 Atom PoE Base (W5500 Ethernet, PoE PD)
;   - Grove DS18B20 unit (Switch Science 10979): waterproof probe, 2 m cable,
;     BUILT-IN pull-up. Plug into the AtomS3 Grove port. DATA = G2 (Grove yellow
;     = SIG; white = G1). Multi-drop more probes on the same bus if desired.
;
;   ⚠ W5500 SPI pins on AtomS3 are NOT the classic ATOM's G22/23/33/19 (those
;     GPIOs don't exist as free pins on the S3). They are passed via the
;     -DW5500_* build flags below and MUST be confirmed against the AtomS3
;     schematic / the base before first boot. See main.cpp for the full note.
;
; Build / upload
;   - First flash over USB-C (native USB CDC). Subsequent flashes over Ethernet
;     via ArduinoOTA (discovered as agri-temp-poe-01) or POST /api/ota.

[env:m5atoms3-poe]
; pioarduino fork = arduino-esp32 3.x, the first release with
; ETH.begin(ETH_PHY_W5500, ...) backed by ESP-IDF lwIP (so mDNS / ArduinoOTA
; work). Same pin as every other -poe node in the fleet.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=3
	; AtomS3 Lite has no USB-UART chip — Serial is the ESP32-S3 native USB CDC,
	; which needs this to be present on boot (classic ATOM nodes set it to 0).
	-DARDUINO_USB_CDC_ON_BOOT=1
	; --- W5500 pins on the Atom PoE base (AtomS3) — VERIFY, see main.cpp ---
	-DW5500_SCK=5
	-DW5500_MISO=7
	-DW5500_MOSI=8
	-DW5500_CS=6

lib_deps =
	https://github.com/yasunorioi/agri-node-poe-core.git
	paulstoffregen/OneWire
	milesburton/DallasTemperature
